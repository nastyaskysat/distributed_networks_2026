services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hw2
      POSTGRES_USER: hw2
      POSTGRES_PASSWORD: hw2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hw2 -d hw2"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
